    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
    
    <!-- Load OpenCV.js locally with CDN fallback -->
    <script>
      // Function to load OpenCV with fallback
      function loadOpenCV() {
        // First try to load the local version
        const localScript = document.createElement('script');
        localScript.setAttribute('src', '/lib/opencv.js');
        localScript.setAttribute('type', 'text/javascript');
        localScript.setAttribute('async', 'true');
        localScript.onerror = function() {
          console.warn('Local OpenCV failed to load, trying CDN...');
          // If local version fails, try CDN
          const cdnScript = document.createElement('script');
          cdnScript.setAttribute('src', 'https://docs.opencv.org/4.x/opencv.js');
          cdnScript.setAttribute('type', 'text/javascript');
          cdnScript.setAttribute('async', 'true');
          document.head.appendChild(cdnScript);
        };
        document.head.appendChild(localScript);
      }
      
      // Load OpenCV when the page loads
      window.addEventListener('load', loadOpenCV);
    </script>
